<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Install Indexademics GPA Calculator</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f9fafb;
        color: #111827;
        margin: 0;
        padding: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 32px;
        max-width: 420px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        object-fit: contain;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      p {
        color: #6b7280;
        line-height: 1.6;
      }
      .steps {
        text-align: left;
        margin: 24px 0;
        padding-left: 20px;
      }
      .steps li {
        margin-bottom: 12px;
      }
      a {
        color: #007aff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/indexademics-logo.png" alt="Indexademics" />
      <h1>Install IDX GPA</h1>
      <p>Add this calculator to your home screen for quick access.</p>
      <ol class="steps">
        <li>Tap the <strong>Share</strong> button in Safari.</li>
        <li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>
        <li>Tap <strong>Add</strong> in the top right.</li>
      </ol>
      <p><a href="/">← Back to calculator</a></p>
    </div>
  </body>
</html>
